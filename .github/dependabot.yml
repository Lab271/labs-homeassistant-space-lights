# A public repo publishes its dependency tree, so a known-vulnerable pin is
# visible to everyone - keep the updates flowing.
#
# `cooldown` waits out a freshly published version, which is the cheap mitigation
# for a compromised release being pulled straight into a PR.
#
# Only `github-actions` applies here: a Home Assistant custom integration declares
# its Python dependencies in `custom_components/artnet_relay/manifest.json`, which
# Home Assistant resolves at install time and Dependabot has no ecosystem for.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
