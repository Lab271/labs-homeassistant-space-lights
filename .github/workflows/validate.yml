#
# HACS installs from GitHub Releases, so a bad manifest only surfaces at install
# time for users. hassfest is Home Assistant's own manifest linter and the HACS
# action mirrors what HACS checks before listing a repo; running both on every
# push plus weekly catches drift before a release goes out. The unit tests in
# ci.yml stay separate - these two jobs pull external actions, those don't.
#
# The org requires every action pinned to a full-length SHA, so the upstream
# `@master` / `@main` refs these two are normally used with are rejected.
# Dependabot moves the pins; the trailing comment records what each SHA was.
name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
